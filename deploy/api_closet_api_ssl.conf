# HTTPS server block for api.closet.wtwr.verymad.net
# Place on the server as /etc/nginx/sites-available/api_closet_api_ssl

server {
    listen 443 ssl;
    server_name api.closet.wtwr.verymad.net;

    # TLS certs: include snippet (on the server this snippet should point to the
    # real Let's Encrypt certs at /etc/letsencrypt/live/closet.wtwr.verymad.net/)
    include /etc/nginx/snippets/snakeoil.conf;

    # Hide any upstream CORS headers so we control them here
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;

    # Diagnostic header to verify which server block handled the request (remove after debugging)
    add_header 'X-Served-By' 'api_closet_api_ssl' always;

    # CORS headers: set allowed origin and related headers for all responses
    # (use 'always' so headers are present on 200/204/301 responses)
    add_header 'Access-Control-Allow-Origin' 'https://closet.wtwr.verymad.net' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
    add_header 'Access-Control-Allow-Headers' 'Origin,Authorization,Content-Type,Accept' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Type' always;
    add_header 'Vary' 'Origin' always;

    # Fast preflight handling: answer OPTIONS immediately with 204
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://closet.wtwr.verymad.net' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            return 204;
        }
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ensure proxied responses also include CORS headers
        add_header 'Access-Control-Allow-Origin' 'https://closet.wtwr.verymad.net' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Origin,Authorization,Content-Type,Accept' always;
        add_header 'Vary' 'Origin' always;
    }

    # Ensure exact /items doesn't get redirected (preflight must be handled)
    location = /items {
        if ($request_method = 'OPTIONS') {
            # fast preflight handled locally; headers are added at server-level block
            return 204;
        }

        proxy_pass http://127.0.0.1:3001$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Ensure proxied responses include CORS headers as well
        add_header 'Access-Control-Allow-Origin' 'https://closet.wtwr.verymad.net' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Origin,Authorization,Content-Type,Accept' always;
        add_header 'Vary' 'Origin' always;
    }

    # Optional: accept trailing slash so both forms work
    location = /items/ {
        proxy_pass http://127.0.0.1:3001$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        # Rely on the server-level conditional CORS block to add headers
        add_header 'Access-Control-Allow-Origin' 'https://closet.wtwr.verymad.net' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Origin,Authorization,Content-Type,Accept' always;
        add_header 'Vary' 'Origin' always;
    }

    access_log /var/log/nginx/api_closet_ssl.access.log;
    error_log  /var/log/nginx/api_closet_ssl.error.log;
}

# HTTP server block for api.closet.wtwr.verymad.net
# Place on the server as /etc/nginx/sites-available/api_closet_api_http

server {
    listen 80;
    server_name api.closet.wtwr.verymad.net;

    # Diagnostic header to confirm which block answered (optional)
    add_header 'X-Served-By' 'api_http' always;

    # CORS headers (always present)
    add_header 'Access-Control-Allow-Origin' 'https://closet.wtwr.verymad.net' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type' always;
    add_header 'Vary' 'Origin' always;

    # Answer preflight BEFORE any redirect
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Redirect other traffic to HTTPS
    return 301 https://$host$request_uri;
}

# Nginx server block for api.closet.wtwr.verymad.net
# Place on the server as /etc/nginx/sites-available/api_closet_api

server {
    listen 80;
    server_name api.closet.wtwr.verymad.net;
    # CORS defaults so preflight and simple requests are answered here
    add_header 'Access-Control-Allow-Origin' 'https://closet.wtwr.verymad.net' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type' always;
    add_header 'Vary' 'Origin' always;

    # Fast preflight handling: answer OPTIONS before any redirect
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Redirect all other HTTP traffic for the API to HTTPS
    return 301 https://$host$request_uri;
}

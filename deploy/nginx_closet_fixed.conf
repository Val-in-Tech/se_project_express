# Working nginx config for closet.wtwr.verymad.net
# Serves static SPA from /var/www/closet.wtwr and proxies API to Express on 127.0.0.1:3001

server {
    listen 80;
    server_name closet.wtwr.verymad.net www.closet.wtwr.verymad.net;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name closet.wtwr.verymad.net www.closet.wtwr.verymad.net;

    # TLS certificates (Let's Encrypt)
    include /etc/nginx/snippets/snakeoil.conf;

    # CORS headers at server level
    add_header 'Access-Control-Allow-Origin' 'https://closet.wtwr.verymad.net' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept' always;
    add_header 'Vary' 'Origin' always;

    # Handle OPTIONS preflight
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Proxy API requests to Express backend
    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /items {
        proxy_pass http://127.0.0.1:3001/items;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /signin {
        proxy_pass http://127.0.0.1:3001/signin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /signup {
        proxy_pass http://127.0.0.1:3001/signup;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /users {
        proxy_pass http://127.0.0.1:3001/users;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Serve static frontend files
    root /var/www/closet.wtwr;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/closet.access.log;
    error_log /var/log/nginx/closet.error.log;
}

server {
    listen 443 ssl;
    server_name api.closet.wtwr.verymad.net;

    include /etc/nginx/snippets/snakeoil.conf;

    # Diagnostic header (optional) to confirm this block handled the request
    add_header 'X-Served-By' 'api_closet_api_ssl' always;

    # Do NOT add Access-Control headers here; let backend handle them to avoid conflicts.
    # Ensure proxied requests pass original headers so Express can read Origin, etc.
    location / {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    access_log /var/log/nginx/api_closet_ssl.access.log;
    error_log  /var/log/nginx/api_closet_ssl.error.log;
}

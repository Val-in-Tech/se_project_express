# Nginx config for closet.wtwr.verymad.net
# Adjust the `root` path below to the directory where your React `dist` files are deployed.
# This config serves the static SPA and proxies API requests to the Express backend.

server {
	listen 80;
	server_name closet.wtwr.verymad.net www.closet.wtwr.verymad.net api.closet.wtwr.verymad.net;

	# CORS defaults for this server: add headers at server scope (allowed here)
	add_header 'Access-Control-Allow-Origin' 'https://closet.wtwr.verymad.net' always;
	add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
	add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type' always;
	add_header 'Vary' 'Origin' always;

	# Fast preflight handling (return only) - handle OPTIONS before any redirect
	if ($request_method = 'OPTIONS') {
		return 204;
	}

	# Redirect HTTP requests for the api subdomain to HTTPS (OPTIONS handled above)
	if ($host = api.closet.wtwr.verymad.net) {
		return 301 https://$host$request_uri;
	}

	# Change this to where your frontend files (Vite `dist`) will be placed on the server
	# Default for this project — adjust if your server uses a different path
	root /var/www/closet.wtwr;
	index index.html;

	# Serve API requests from Node backend running on localhost:3001
	# If your backend is served on a different port or host adjust accordingly.
	location /api/ {
		proxy_pass http://127.0.0.1:3001/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# Ensure the backend responses include the correct CORS headers
		add_header 'Access-Control-Allow-Origin' 'https://closet.wtwr.verymad.net' always;
		add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
		add_header 'Access-Control-Allow-Credentials' 'true' always;
		add_header 'Vary' 'Origin' always;
	}

	# If your backend exposes endpoints not prefixed with /api (for example /items, /signin),
	# add explicit proxy rules for them so Nginx forwards those requests to the Express backend.
	# Below are example proxy rules for routes used by this project.
	location /items {
		proxy_pass http://127.0.0.1:3001/items;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		add_header 'Access-Control-Allow-Origin' 'https://closet.wtwr.verymad.net' always;
		add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
		add_header 'Access-Control-Allow-Credentials' 'true' always;
		add_header 'Vary' 'Origin' always;
	}
	location /signin {
		proxy_pass http://127.0.0.1:3001/signin;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		add_header 'Access-Control-Allow-Origin' 'https://closet.wtwr.verymad.net' always;
		add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
		add_header 'Access-Control-Allow-Credentials' 'true' always;
		add_header 'Vary' 'Origin' always;
	}
	location /signup {
		proxy_pass http://127.0.0.1:3001/signup;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		add_header 'Access-Control-Allow-Origin' 'https://closet.wtwr.verymad.net' always;
		add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
		add_header 'Access-Control-Allow-Credentials' 'true' always;
		add_header 'Vary' 'Origin' always;
	}

	# Ensure exact /items doesn't get redirected (preflight must be handled)
	location = /items {
	    # Handle preflight immediately at nginx
	    if ($request_method = 'OPTIONS') {
	        return 204;
	    }

	    proxy_pass http://127.0.0.1:3001$request_uri;
	    proxy_set_header Host $host;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;
	    proxy_redirect off;

	    add_header 'Access-Control-Allow-Origin' 'https://closet.wtwr.verymad.net' always;
	    add_header 'Access-Control-Allow-Credentials' 'true' always;
	    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
	    add_header 'Vary' 'Origin' always;
	}

	# Optional: accept trailing slash so both forms work
	location = /items/ {
	    proxy_pass http://127.0.0.1:3001$request_uri;
	    proxy_set_header Host $host;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;
	    proxy_redirect off;

	    add_header 'Access-Control-Allow-Origin' 'https://closet.wtwr.verymad.net' always;
	    add_header 'Access-Control-Allow-Credentials' 'true' always;
	    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
	    add_header 'Vary' 'Origin' always;
	}

	# Serve the SPA: try the requested file, otherwise fallback to index.html (for client-side routing)
	location / {
		try_files $uri $uri/ /index.html;
	}

	access_log /var/log/nginx/closet.access.log;
	error_log /var/log/nginx/closet.error.log;
}

# For production use you should enable HTTPS (certbot or other). A simple HTTP setup is above.

server {
	listen 443 ssl;
	server_name closet.wtwr.verymad.net www.closet.wtwr.verymad.net api.closet.wtwr.verymad.net;

	# Diagnostic header to verify which server block handled the request (remove after debugging)
	add_header 'X-Served-By' 'closet_ssl' always;

	# TLS certs: include snippet that should point to Let's Encrypt certs on the server
	include /etc/nginx/snippets/snakeoil.conf;

    # Hide any upstream CORS headers so we can control them here
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;

    # CORS headers -> always (applies to redirects and all responses)
    add_header 'Access-Control-Allow-Origin' 'https://closet.wtwr.verymad.net' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type' always;
    add_header 'Vary' 'Origin' always;

    # Fast preflight handling
    if ($request_method = 'OPTIONS') {
        return 204;
    }

	# Proxy API endpoints to the backend and serve the SPA statically for everything else
	location /api/ {
		proxy_pass http://127.0.0.1:3001/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		add_header 'Access-Control-Allow-Origin' 'https://closet.wtwr.verymad.net' always;
		add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
		add_header 'Access-Control-Allow-Credentials' 'true' always;
		add_header 'Vary' 'Origin' always;
	}

	location /signup {
		proxy_pass http://127.0.0.1:3001/signup;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		add_header 'Access-Control-Allow-Origin' 'https://closet.wtwr.verymad.net' always;
		add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
		add_header 'Access-Control-Allow-Credentials' 'true' always;
		add_header 'Vary' 'Origin' always;
	}

	# Serve the SPA: try the requested file, otherwise fallback to index.html (for client-side routing)
	root /var/www/closet.wtwr;
	index index.html;

	location / {
		try_files $uri $uri/ /index.html;
	}

    access_log /var/log/nginx/api_closet_ssl.access.log;
    error_log  /var/log/nginx/api_closet_ssl.error.log;
}
